<!DOCTYPE html>
<html>

<head>

<title>Registration Form</title>

<style>

body{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:#f5f5f5;
font-family:Arial;
}

.container{
width:420px;
background:#eaeaea;
padding:40px;
border-radius:10px;
}

input{
width:100%;
padding:14px;
margin-bottom:28px;
}

button{
background:green;
color:white;
border:none;
padding:12px 28px;
}

</style>

</head>

<body>

<div class="container">

<h1>Registration Form</h1>

<form>

<input type="text" placeholder="Enter Name">

<input type="email" placeholder="Enter Email">

<input type="password" placeholder="Enter Password">

<button type="submit">
Register
</button>

</form>

</div>

</body>
</html>
