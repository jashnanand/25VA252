<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TechStore</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background-color:#e9e9e9;
font-family:Arial;
}

.navbar-custom{
background-color:#1d1f27;
padding:15px 0;
}

.navbar-brand{
color:white;
font-size:32px;
font-weight:bold;
}

.product-section{
padding:50px 0;
}

.card{
border-radius:10px;
transition:0.3s;
}

.card:hover{
transform:scale(1.03);
}

.price{
font-size:24px;
font-weight:bold;
}

.footer{
background-color:#1d1f27;
color:white;
text-align:center;
padding:18px;
margin-top:40px;
}

</style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-custom">

<div class="container">

<a class="navbar-brand" href="#">TechStore</a>

</div>

</nav>

<div class="container product-section">

<div class="row g-4">

<div class="col-md-4">

<div class="card h-100">

<img src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853"
class="card-img-top">

<div class="card-body">

<h3>Laptop</h3>

<p>High performance laptop</p>

<p class="price">
₹50,000
</p>

<button class="btn btn-primary">
View Details
</button>

</div>
</div>
</div>

</div>
</div>

<div class="footer">
© 2026 TechStore
</div>

</body>
</html>
