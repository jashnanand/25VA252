<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bootstrap Responsive Page</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
margin:0;
padding:0;
background-color:#e6e6e6;
font-family:Arial,sans-serif;
}

.header{
background-color:#3578d6;
color:white;
text-align:center;
padding:70px;
}

.header h1{
font-size:60px;
font-weight:bold;
}

.navbar-section{
background-color:#222;
color:white;
padding:15px;
}

.navbar-section a{
color:white;
text-decoration:none;
margin-left:20px;
font-size:18px;
}

.content{
padding:50px;
min-height:350px;
}

.left-column{
border-right:3px solid black;
}

.footer{
background-color:#333;
color:white;
text-align:center;
padding:18px;
}

</style>
</head>

<body>

<div class="container-fluid header">
<h1>My Website</h1>
</div>

<div class="container-fluid navbar-section">
<div class="row">

<div class="col-md-6 text-start">
<h3>Website</h3>
</div>

<div class="col-md-6 text-end">
<a href="#">Home</a>
<a href="#">About</a>
<a href="#">Services</a>
<a href="#">Contact</a>
</div>

</div>
</div>

<div class="container-fluid content">
<div class="row">

<div class="col-md-6 left-column">
<h2>Column 1</h2>

<p>
This is first column
</p>
</div>

<div class="col-md-6">
<h2>Column 2</h2>

<p>
This is second column
</p>
</div>

</div>
</div>

<div class="container-fluid footer">
Copyright © 2026 My Website
</div>

</body>
</html>
